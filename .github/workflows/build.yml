name: Build AutoAnvil

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.2.0'

      - name: Verify Gradle
        run: gradle --version

      - name: Build mod
        run: gradle build --no-daemon --stacktrace --info

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: AutoAnvil-1.21.11
          path: build/libs/*.jar
          if-no-files-found: error
